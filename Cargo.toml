[workspace]
members = [
    "crates/openresponses",
    "crates/openresponses-axum",
    "crates/openresponses-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dave-tucker/openresponses-rs"
homepage = "https://www.openresponses.org"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
