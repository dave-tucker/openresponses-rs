services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 2s
      timeout: 5s
      retries: 15

  compliance:
    image: oven/bun:1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ../openresponses:/app:ro
      - ./scripts/regexp-fix.js:/preload/regexp-fix.js:ro
    working_dir: /app
    command:
      - bun
      - --preload
      - /preload/regexp-fix.js
      - ./bin/compliance-test.ts
      - --base-url
      - http://server:3000/v1
      - --api-key
      - test
      - --json
